name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gameshelf
          POSTGRES_USER: postgres
          # No password at all. The container is reachable only from this job
          # and is destroyed with it, so a placeholder credential would add no
          # security -- it would just be one more committed string that secret
          # scanners have to be taught to ignore.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Inside the runner the services are reachable on localhost at the default
      # ports; the 5434/6380 remap in docker-compose.yml is only for your machine.
      DB_USER: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-never-used-to-sign-anything-real
      RAWG_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Compose database URLs
        # No .env file exists here, which is the point -- settings must come
        # from the environment.
        run: |
          base="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}"
          echo "DATABASE_URL=${base}/gameshelf" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=${base}/gameshelf_test" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest --cov --cov-report=term-missing

      - name: Run migrations
        run: alembic upgrade head

      - name: Check migrations match the models
        # Catches the common failure of editing a model and forgetting to
        # generate a migration -- that works locally and breaks on deploy.
        run: alembic check

      - name: Check migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # ci, not install: fails on a lockfile that disagrees with package.json
        # instead of quietly resolving something new.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
