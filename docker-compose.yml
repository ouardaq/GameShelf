services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gameshelf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5434:5432"]        # was 5432:5432
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]        # was 6379:6379
volumes:
  pgdata: